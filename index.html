<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 扑克牌游戏 - 21点 & 10點半</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色调 */
            --primary-color: #2c5f2d;
            --secondary-color: #97cc04;
            --accent-color: #ffd700;
            
            /* 卡牌颜色 */
            --card-red: #dc143c;
            --card-black: #000;
            --card-bg: #ffffff;
            
            /* 按钮颜色 */
            --btn-primary: #4CAF50;
            --btn-danger: #f44336;
            --btn-disabled: #cccccc;
            
            /* 状态颜色 */
            --win-color: #4CAF50;
            --lose-color: #f44336;
            --push-color: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c1e 0%, #2c5f2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== 游戏容器 ========== */
        #game-container {
            background: var(--primary-color);
            border-radius: 20px;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* ========== 标题 ========== */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* ========== 信息栏 ========== */
        #info-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
        }

        #balance, #current-bet {
            display: flex;
            align-items: center;
        }

        #balance-amount, #bet-amount {
            color: var(--accent-color);
            margin-left: 5px;
        }

        /* ========== 游戏区域 ========== */
        #dealer-area, #player-area {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 180px;
        }

        #dealer-area h2, #player-area h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 120px;
            align-items: center;
        }

        /* ========== 卡牌样式 ========== */
        .card {
            width: 80px;
            height: 112px;
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.hidden {
            background: linear-gradient(135deg, #3a5fcd 0%, #1e3a8a 100%);
            color: white;
            font-size: 32px;
        }

        .card.red {
            color: var(--card-red);
        }

        .card.black {
            color: var(--card-black);
        }

        /* ========== 分数显示 ========== */
        #dealer-score, #player-score {
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 15px;
        }

        #dealer-score span, #player-score span {
            color: var(--accent-color);
        }

        /* ========== 消息框 ========== */
        #message-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        #game-message {
            color: white;
            font-size: 1.4em;
            font-weight: bold;
        }

        #game-message.win {
            color: var(--win-color);
        }

        #game-message.lose {
            color: var(--lose-color);
        }

        #game-message.push {
            color: var(--push-color);
        }

        /* ========== 按钮样式 ========== */
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--btn-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #45a049;
        }

        .btn-secondary {
            background: #555;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #666;
        }

        /* ========== 操作按钮区域 ========== */
        #action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        #action-buttons .btn {
            min-width: 150px;
        }

        /* ========== 下注区域 ========== */
        #betting-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        #betting-area h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        #bet-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-bet {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.1em;
            font-weight: bold;
            border: 3px solid var(--accent-color);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .btn-bet:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .btn-bet:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ========== 游戏控制 ========== */
        #game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* ========== 规则弹窗 ========== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            color: #aaa;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: #000;
        }

        #rules-text {
            line-height: 1.8;
            color: #333;
        }

        #rules-text h3 {
            color: var(--primary-color);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #rules-text ul {
            margin-left: 25px;
            margin-bottom: 15px;
        }

        #rules-text li {
            margin-bottom: 8px;
        }

        /* ========== 游戏选择器 ========== */
        #game-selector {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        #game-selector h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .game-select-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-game-select {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-game-select:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-game-select.active {
            background: var(--accent-color);
            color: #333;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.5);
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 1024px) {
            .card {
                width: 60px;
                height: 84px;
                font-size: 36px;
            }
        }

        @media (max-width: 768px) {
            #game-container {
                padding: 20px;
            }

            header h1 {
                font-size: 2em;
            }

            #info-bar {
                flex-direction: column;
                gap: 10px;
                font-size: 1em;
            }

            .card {
                width: 50px;
                height: 70px;
                font-size: 28px;
                margin: 3px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 1em;
            }

            #action-buttons {
                flex-direction: column;
                align-items: center;
            }

            #action-buttons .btn {
                min-width: 200px;
            }

            .btn-bet {
                width: 60px;
                height: 60px;
                font-size: 1em;
            }

            .modal-content {
                margin: 10% 5%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 标题 -->
        <header>
            <h1 id="game-title">🎰 21点 Blackjack</h1>
        </header>
        
        <!-- 游戏选择器 -->
        <div id="game-selector">
            <h3>🎮 选择游戏</h3>
            <div class="game-select-buttons">
                <button class="btn-game-select active" data-game="blackjack">21点 Blackjack</button>
                <button class="btn-game-select" data-game="tenhalf">10點半 Ten & Half</button>
            </div>
        </div>
        
        <!-- 信息栏 -->
        <div id="info-bar">
            <div id="balance">余额: $<span id="balance-amount">1000</span></div>
            <div id="current-bet">当前下注: $<span id="bet-amount">0</span></div>
        </div>
        
        <!-- 庄家区域 -->
        <div id="dealer-area">
            <h2>🎩 庄家</h2>
            <div id="dealer-cards" class="card-container"></div>
            <div id="dealer-score">点数: <span>0</span></div>
        </div>
        
        <!-- 玩家区域 -->
        <div id="player-area">
            <h2>👤 玩家</h2>
            <div id="player-cards" class="card-container"></div>
            <div id="player-score">点数: <span>0</span></div>
        </div>
        
        <!-- 状态提示 -->
        <div id="message-box">
            <p id="game-message">请下注开始游戏</p>
        </div>
        
        <!-- 操作按钮 -->
        <div id="action-buttons">
            <button id="btn-hit" class="btn btn-primary" disabled>要牌 (Hit)</button>
            <button id="btn-stand" class="btn btn-primary" disabled>停牌 (Stand)</button>
        </div>
        
        <!-- 下注区域 -->
        <div id="betting-area">
            <h3>💰 选择下注金额</h3>
            <div id="bet-buttons">
                <button class="btn-bet" data-bet="10">$10</button>
                <button class="btn-bet" data-bet="25">$25</button>
                <button class="btn-bet" data-bet="50">$50</button>
                <button class="btn-bet" data-bet="100">$100</button>
            </div>
        </div>
        
        <!-- 游戏控制 -->
        <div id="game-controls">
            <button id="btn-new-game" class="btn btn-secondary">新游戏</button>
            <button id="btn-rules" class="btn btn-secondary">规则说明</button>
        </div>
    </div>
    
    <!-- 规则弹窗 -->
    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="rules-title" style="text-align: center; color: #2c5f2d;">游戏规则</h2>
            <div id="rules-text">
                <!-- Rules content will be dynamically loaded based on selected game -->
            </div>
        </div>
    </div>

    <script>
        // ========== 游戏状态 ==========
        let game = {
            mode: 'blackjack', // 'blackjack' or 'tenhalf'
            deck: [],
            player: {
                hand: [],
                score: 0,
                balance: 1000,
                bet: 0
            },
            dealer: {
                hand: [],
                score: 0,
                hiddenCard: null
            },
            phase: 'betting', // 'betting', 'playing', 'dealer', 'end'
            message: '请下注开始游戏'
        };

        // ========== 常量 ==========
        const CONSTANTS = {
            INITIAL_BALANCE: 1000,
            MIN_BET: 10,
            MAX_BET: 500,
            BLACKJACK_PAYOUT: 1.5,
            WIN_PAYOUT: 1,
            TIANGONG_PAYOUT: 2,  // 天公 (Heaven) 赔率
            DEALER_STAND_VALUE_BJ: 17,
            DEALER_STAND_VALUE_TH: 8,  // 庄家8点以上停牌
            BUST_VALUE_BJ: 21,
            BUST_VALUE_TH: 10.5,
            DECK_RESHUFFLE_THRESHOLD: 15
        };
        
        // ========== 游戏规则文本 ==========
        const GAME_RULES = {
            blackjack: `
                <h3>【游戏目标】</h3>
                <p>获得点数尽可能接近21点，但不能超过21点，同时要比庄家的点数更高。</p>
                
                <h3>【牌面点数】</h3>
                <ul>
                    <li>数字牌 (2-10)：按牌面点数计算</li>
                    <li>J、Q、K：每张算10点</li>
                    <li>A (Ace)：可算1点或11点（自动选择最优值）</li>
                </ul>
                
                <h3>【游戏流程】</h3>
                <ul>
                    <li><strong>1. 下注</strong>：选择下注金额 ($10/$25/$50/$100)</li>
                    <li><strong>2. 发牌</strong>：玩家和庄家各获得2张牌
                        <ul>
                            <li>玩家的牌都是明牌</li>
                            <li>庄家一张明牌，一张暗牌</li>
                        </ul>
                    </li>
                    <li><strong>3. 玩家操作</strong>：
                        <ul>
                            <li>要牌 (Hit)：再拿一张牌</li>
                            <li>停牌 (Stand)：不再要牌，结束操作</li>
                        </ul>
                    </li>
                    <li><strong>4. 庄家操作</strong>：
                        <ul>
                            <li>16点或以下：必须要牌</li>
                            <li>17点或以上：必须停牌</li>
                        </ul>
                    </li>
                </ul>
                
                <h3>【胜负判定】</h3>
                <ul>
                    <li><strong>Blackjack</strong>：前两张牌点数为21，赔率 3:2</li>
                    <li><strong>玩家爆牌</strong>：超过21点，立即输掉</li>
                    <li><strong>庄家爆牌</strong>：玩家未爆牌则获胜，赔率 1:1</li>
                    <li><strong>比较点数</strong>：都未爆牌时，点数高者获胜</li>
                    <li><strong>平局 (Push)</strong>：点数相同，退还赌注</li>
                </ul>
                
                <h3>【小提示】</h3>
                <ul>
                    <li>12-16点时需谨慎决策</li>
                    <li>17点以上通常应停牌</li>
                    <li>注意庄家的明牌</li>
                    <li>合理管理筹码</li>
                </ul>
                
                <p style="text-align: center; margin-top: 20px; font-size: 1.2em;">祝你好运！🍀</p>
            `,
            tenhalf: `
                <h3>【游戏概述】</h3>
                <p>10点半（又称"十点半"）是一种流行的华人扑克牌游戏，类似于21点，但目标点数是10.5点而非21点。</p>
                
                <h3>【牌面点数】</h3>
                <ul>
                    <li><strong>A (Ace)</strong>：1点</li>
                    <li><strong>2-10</strong>：按牌面数字计算</li>
                    <li><strong>J、Q、K</strong>：都算0.5点</li>
                </ul>
                
                <h3>【游戏目标】</h3>
                <p>手牌总点数尽可能接近但不超过10.5点，超过则"爆牌"（输掉）。</p>
                
                <h3>【游戏流程】</h3>
                <ul>
                    <li><strong>1. 发牌</strong>：
                        <ul>
                            <li>玩家获得1张牌（明牌）</li>
                            <li>庄家在玩家停牌后才发牌</li>
                        </ul>
                    </li>
                    <li><strong>2. 要牌阶段</strong>：
                        <ul>
                            <li>玩家决定是否"要牌"或"停牌"</li>
                            <li>可以连续要牌，直到满意或爆牌</li>
                            <li>如果超过10.5点即爆牌，立即输掉</li>
                        </ul>
                    </li>
                    <li><strong>3. 庄家要牌</strong>：
                        <ul>
                            <li>玩家停牌后，庄家按规则要牌</li>
                            <li>庄家点数小于8点必须要牌</li>
                            <li>庄家点数8点或以上必须停牌</li>
                        </ul>
                    </li>
                    <li><strong>4. 比牌</strong>：
                        <ul>
                            <li>没有爆牌的玩家与庄家比较点数</li>
                            <li>点数大者获胜</li>
                            <li>点数相同庄家赢</li>
                        </ul>
                    </li>
                </ul>
                
                <h3>【特殊牌型】</h3>
                <ul>
                    <li><strong>天公（10点半）</strong>：第一张牌是10，第二张是J/Q/K，或反之。赔率 2:1</li>
                    <li><strong>五小龙/五小</strong>：拿到5张牌且总点数不超过10.5点。赔率 3:2</li>
                    <li><strong>人公</strong>：第一手牌（前两张）即为10点半（天公）</li>
                </ul>
                
                <h3>【小提示】</h3>
                <ul>
                    <li>人头牌(J/Q/K)只有0.5点，要善用</li>
                    <li>8点以上需谨慎决策</li>
                    <li>争取拿到5张牌获得五小龙</li>
                    <li>注意庄家平局时获胜的规则</li>
                </ul>
                
                <p style="text-align: center; margin-top: 20px; font-size: 1.2em;">祝你好运！🍀</p>
            `
        };

        const BET_OPTIONS = [10, 25, 50, 100];

        // ========== DOM 元素 ==========
        const elements = {
            gameTitle: document.getElementById('game-title'),
            gameSelectButtons: document.querySelectorAll('.btn-game-select'),
            balanceAmount: document.getElementById('balance-amount'),
            betAmount: document.getElementById('bet-amount'),
            dealerCards: document.getElementById('dealer-cards'),
            dealerScore: document.querySelector('#dealer-score span'),
            playerCards: document.getElementById('player-cards'),
            playerScore: document.querySelector('#player-score span'),
            gameMessage: document.getElementById('game-message'),
            btnHit: document.getElementById('btn-hit'),
            btnStand: document.getElementById('btn-stand'),
            btnNewGame: document.getElementById('btn-new-game'),
            btnRules: document.getElementById('btn-rules'),
            betButtons: document.querySelectorAll('.btn-bet'),
            rulesModal: document.getElementById('rules-modal'),
            rulesTitle: document.getElementById('rules-title'),
            rulesText: document.getElementById('rules-text'),
            modalClose: document.querySelector('.close')
        };

        // ========== 初始化游戏 ==========
        function initGame() {
            game.deck = shuffleDeck(createDeck());
            game.player = {
                hand: [],
                score: 0,
                balance: CONSTANTS.INITIAL_BALANCE,
                bet: 0
            };
            game.dealer = {
                hand: [],
                score: 0,
                hiddenCard: null
            };
            game.phase = 'betting';
            game.message = '请下注开始游戏';
            updateUI();
        }

        // ========== 创建牌组 ==========
        function createDeck() {
            const suits = [
                { name: 'spades', color: 'black', baseCode: 0x1F0A0 },
                { name: 'hearts', color: 'red', baseCode: 0x1F0B0 },
                { name: 'diamonds', color: 'red', baseCode: 0x1F0C0 },
                { name: 'clubs', color: 'black', baseCode: 0x1F0D0 }
            ];
            
            const ranks = [
                { rank: 'A', valueBJ: 11, valueTH: 1, offset: 1 },
                { rank: '2', valueBJ: 2, valueTH: 2, offset: 2 },
                { rank: '3', valueBJ: 3, valueTH: 3, offset: 3 },
                { rank: '4', valueBJ: 4, valueTH: 4, offset: 4 },
                { rank: '5', valueBJ: 5, valueTH: 5, offset: 5 },
                { rank: '6', valueBJ: 6, valueTH: 6, offset: 6 },
                { rank: '7', valueBJ: 7, valueTH: 7, offset: 7 },
                { rank: '8', valueBJ: 8, valueTH: 8, offset: 8 },
                { rank: '9', valueBJ: 9, valueTH: 9, offset: 9 },
                { rank: '10', valueBJ: 10, valueTH: 10, offset: 10 },
                { rank: 'J', valueBJ: 10, valueTH: 0.5, offset: 11 },
                { rank: 'Q', valueBJ: 10, valueTH: 0.5, offset: 13 },
                { rank: 'K', valueBJ: 10, valueTH: 0.5, offset: 14 }
            ];
            
            const deck = [];
            
            for (let suit of suits) {
                for (let rankInfo of ranks) {
                    deck.push({
                        suit: suit.name,
                        rank: rankInfo.rank,
                        valueBJ: rankInfo.valueBJ,
                        valueTH: rankInfo.valueTH,
                        unicode: String.fromCodePoint(suit.baseCode + rankInfo.offset),
                        color: suit.color
                    });
                }
            }
            
            return deck;
        }

        // ========== Fisher-Yates 洗牌算法 ==========
        function shuffleDeck(deck) {
            const shuffled = [...deck];
            
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            return shuffled;
        }

        // ========== 发牌 ==========
        function dealCard() {
            if (game.deck.length < CONSTANTS.DECK_RESHUFFLE_THRESHOLD) {
                game.deck = shuffleDeck(createDeck());
                showMessage('牌组重新洗牌！');
            }
            return game.deck.pop();
        }

        // ========== 计算手牌点数 ==========
        function calculateScore(hand) {
            if (game.mode === 'blackjack') {
                return calculateScoreBlackjack(hand);
            } else {
                return calculateScoreTenHalf(hand);
            }
        }
        
        // ========== 21点计分 ==========
        function calculateScoreBlackjack(hand) {
            let score = 0;
            let aces = 0;
            
            for (let card of hand) {
                if (card.rank === 'A') {
                    aces++;
                    score += 11;
                } else {
                    score += card.valueBJ;
                }
            }
            
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            
            return score;
        }
        
        // ========== 10點半计分 ==========
        function calculateScoreTenHalf(hand) {
            let score = 0;
            
            for (let card of hand) {
                score += card.valueTH;
            }
            
            return score;
        }

        // ========== 判断 Blackjack ==========
        function isBlackjack(hand) {
            if (hand.length !== 2) return false;
            const score = calculateScore(hand);
            return score === 21;
        }
        
        // ========== 判断天公 (10点半特殊牌型) ==========
        function isTiangong(hand) {
            if (hand.length !== 2) return false;
            const score = calculateScoreTenHalf(hand);
            if (score !== 10.5) return false;
            
            // 必须是一张10和一张J/Q/K的组合
            const has10 = hand.some(card => card.rank === '10');
            const hasFace = hand.some(card => ['J', 'Q', 'K'].includes(card.rank));
            
            return has10 && hasFace;
        }
        
        // ========== 判断五小龙 (5张牌不爆牌) ==========
        function isWuXiaoLong(hand) {
            if (hand.length !== 5) return false;
            const score = calculateScoreTenHalf(hand);
            return score <= CONSTANTS.BUST_VALUE_TH;
        }

        // ========== 下注 ==========
        function placeBet(amount) {
            if (game.phase !== 'betting') return;
            if (amount > game.player.balance) {
                showMessage('余额不足！');
                return;
            }
            
            game.player.bet = amount;
            game.player.balance -= amount;
            game.phase = 'playing';
            startRound();
        }

        // ========== 开始回合 ==========
        function startRound() {
            // 清空手牌
            game.player.hand = [];
            game.dealer.hand = [];
            
            if (game.mode === 'blackjack') {
                // 21点: 玩家和庄家各发2张牌
                game.player.hand.push(dealCard());
                game.dealer.hand.push(dealCard());
                game.player.hand.push(dealCard());
                game.dealer.hiddenCard = dealCard();
                game.dealer.hand.push(game.dealer.hiddenCard);
                
                // 计算点数
                game.player.score = calculateScore(game.player.hand);
                game.dealer.score = calculateScore([game.dealer.hand[0]]);
                
                // 检查 Blackjack
                if (isBlackjack(game.player.hand)) {
                    if (isBlackjack(game.dealer.hand)) {
                        endRound('push', '双方都是 Blackjack！平局！');
                    } else {
                        endRound('blackjack', '🎉 Blackjack! 你赢了！');
                    }
                } else {
                    showMessage('轮到你操作了！');
                    updateUI();
                }
            } else {
                // 10點半: 玩家先发1张牌
                game.player.hand.push(dealCard());
                game.player.score = calculateScore(game.player.hand);
                game.dealer.hiddenCard = null;
                game.dealer.score = 0;
                
                showMessage('轮到你操作了！');
                updateUI();
            }
        }

        // ========== 玩家要牌 ==========
        function hit() {
            if (game.phase !== 'playing') return;
            
            const card = dealCard();
            game.player.hand.push(card);
            game.player.score = calculateScore(game.player.hand);
            
            const bustValue = game.mode === 'blackjack' ? CONSTANTS.BUST_VALUE_BJ : CONSTANTS.BUST_VALUE_TH;
            
            if (game.player.score > bustValue) {
                endRound('lose', '爆牌了！你输了！');
            } else if (game.mode === 'blackjack' && game.player.score === 21) {
                stand();
            } else if (game.mode === 'tenhalf') {
                // 10點半特殊判定
                if (game.player.hand.length === 2 && isTiangong(game.player.hand)) {
                    // 天公/人公：前两张即为10.5（10+J/Q/K）
                    endRound('tiangong', '🎉 天公（10点半）！你赢了！');
                } else if (isWuXiaoLong(game.player.hand)) {
                    // 五小龙：5张牌不爆牌
                    endRound('wuxiaolong', '🎉 五小龙！你赢了！');
                } else if (game.player.score === 10.5) {
                    stand();
                } else {
                    showMessage(`当前点数: ${game.player.score}，继续要牌或停牌？`);
                    updateUI();
                }
            } else {
                showMessage(`当前点数: ${game.player.score}，继续要牌或停牌？`);
                updateUI();
            }
        }

        // ========== 玩家停牌 ==========
        function stand() {
            if (game.phase !== 'playing') return;
            
            game.phase = 'dealer';
            showMessage('庄家操作中...');
            updateUI();
            
            setTimeout(() => {
                dealerPlay();
            }, 1000);
        }

        // ========== 庄家自动操作 ==========
        function dealerPlay() {
            const dealerStandValue = game.mode === 'blackjack' ? CONSTANTS.DEALER_STAND_VALUE_BJ : CONSTANTS.DEALER_STAND_VALUE_TH;
            
            if (game.mode === 'tenhalf') {
                // 10點半: 庄家从0开始发牌
                game.dealer.hand = [];
                game.dealer.score = 0;
            } else {
                // 21点: 显示暗牌
                game.dealer.score = calculateScore(game.dealer.hand);
            }
            updateUI();
            
            const dealerTurn = () => {
                if (game.dealer.score < dealerStandValue) {
                    setTimeout(() => {
                        const card = dealCard();
                        game.dealer.hand.push(card);
                        game.dealer.score = calculateScore(game.dealer.hand);
                        updateUI();
                        dealerTurn();
                    }, 800);
                } else {
                    setTimeout(() => {
                        determineWinner();
                    }, 500);
                }
            };
            
            dealerTurn();
        }

        // ========== 判定胜负 ==========
        function determineWinner() {
            const playerScore = game.player.score;
            const dealerScore = game.dealer.score;
            const bustValue = game.mode === 'blackjack' ? CONSTANTS.BUST_VALUE_BJ : CONSTANTS.BUST_VALUE_TH;
            
            if (game.mode === 'blackjack') {
                const playerBlackjack = isBlackjack(game.player.hand);
                const dealerBlackjack = isBlackjack(game.dealer.hand);
                
                if (playerScore > bustValue) {
                    endRound('lose', '爆牌了！你输了！');
                } else if (playerBlackjack && !dealerBlackjack) {
                    endRound('blackjack', '🎉 Blackjack! 你赢了！');
                } else if (playerBlackjack && dealerBlackjack) {
                    endRound('push', '平局！退还赌注');
                } else if (dealerScore > bustValue) {
                    endRound('win', '庄家爆牌！你赢了！');
                } else if (playerScore > dealerScore) {
                    endRound('win', '你赢了！');
                } else if (playerScore === dealerScore) {
                    endRound('push', '平局！退还赌注');
                } else {
                    endRound('lose', '你输了！');
                }
            } else {
                // 10點半模式
                if (playerScore > bustValue) {
                    endRound('lose', '爆牌了！你输了！');
                } else if (dealerScore > bustValue) {
                    endRound('win', '庄家爆牌！你赢了！');
                } else if (playerScore > dealerScore) {
                    endRound('win', '你赢了！');
                } else if (playerScore === dealerScore) {
                    // 10點半规则：点数相同庄家赢
                    endRound('lose', '点数相同，庄家赢！');
                } else {
                    endRound('lose', '你输了！');
                }
            }
        }

        // ========== 结束回合 ==========
        function endRound(result, message) {
            game.phase = 'end';
            
            let payout = 0;
            
            switch (result) {
                case 'blackjack':
                    payout = game.player.bet * (1 + CONSTANTS.BLACKJACK_PAYOUT);
                    break;
                case 'tiangong':
                    // 天公：2:1赔率
                    payout = game.player.bet * (1 + CONSTANTS.TIANGONG_PAYOUT);
                    break;
                case 'wuxiaolong':
                    // 五小龙：3:2赔率
                    payout = game.player.bet * (1 + CONSTANTS.BLACKJACK_PAYOUT);
                    break;
                case 'win':
                    payout = game.player.bet * (1 + CONSTANTS.WIN_PAYOUT);
                    break;
                case 'push':
                    payout = game.player.bet;
                    break;
                case 'lose':
                    payout = 0;
                    break;
            }
            
            game.player.balance += payout;
            
            const gain = payout - game.player.bet;
            let finalMessage = message;
            if (gain > 0) {
                finalMessage += ` 你赢得 $${gain}`;
            } else if (gain < 0) {
                finalMessage += ` 你输掉 $${Math.abs(gain)}`;
            }
            
            showMessage(finalMessage, result);
            updateUI();
            
            // 检查余额
            if (game.player.balance === 0) {
                setTimeout(() => {
                    showMessage('余额为0！游戏结束！', 'lose');
                }, 1000);
            }
        }

        // ========== 新游戏 ==========
        function newGame() {
            if (game.phase === 'end' || game.phase === 'betting') {
                game.player.hand = [];
                game.dealer.hand = [];
                game.player.score = 0;
                game.dealer.score = 0;
                game.player.bet = 0;
                game.dealer.hiddenCard = null;
                game.phase = 'betting';
                
                if (game.player.balance === 0) {
                    game.player.balance = CONSTANTS.INITIAL_BALANCE;
                }
                
                showMessage('请下注开始游戏');
                updateUI();
            }
        }

        // ========== 显示消息 ==========
        function showMessage(message, type = '') {
            game.message = message;
            elements.gameMessage.textContent = message;
            elements.gameMessage.className = type;
        }

        // ========== 更新UI ==========
        function updateUI() {
            // 更新余额
            elements.balanceAmount.textContent = game.player.balance;
            elements.betAmount.textContent = game.player.bet;
            
            // 更新玩家手牌
            elements.playerCards.innerHTML = '';
            game.player.hand.forEach(card => {
                const cardDiv = createCardElement(card);
                elements.playerCards.appendChild(cardDiv);
            });
            elements.playerScore.textContent = game.player.score;
            
            // 更新庄家手牌
            elements.dealerCards.innerHTML = '';
            game.dealer.hand.forEach((card, index) => {
                const isHidden = (game.phase === 'playing' && index === 1);
                const cardDiv = createCardElement(card, isHidden);
                elements.dealerCards.appendChild(cardDiv);
            });
            
            if (game.phase === 'playing' && game.mode === 'blackjack' && game.dealer.hand.length > 0) {
                elements.dealerScore.textContent = calculateScore([game.dealer.hand[0]]);
            } else {
                elements.dealerScore.textContent = game.dealer.score;
            }
            
            // 更新按钮状态
            updateButtons();
        }

        // ========== 创建卡牌元素 ==========
        function createCardElement(card, hidden = false) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            
            if (hidden) {
                cardDiv.classList.add('hidden');
                cardDiv.textContent = '🂠';
            } else {
                cardDiv.classList.add(card.color);
                cardDiv.textContent = card.unicode;
            }
            
            return cardDiv;
        }

        // ========== 更新按钮状态 ==========
        function updateButtons() {
            // 操作按钮
            elements.btnHit.disabled = game.phase !== 'playing';
            elements.btnStand.disabled = game.phase !== 'playing';
            
            // 下注按钮
            elements.betButtons.forEach(btn => {
                const betAmount = parseInt(btn.dataset.bet);
                btn.disabled = game.phase !== 'betting' || betAmount > game.player.balance;
            });
            
            // 新游戏按钮
            elements.btnNewGame.disabled = game.phase === 'playing' || game.phase === 'dealer';
        }

        // ========== 切换游戏模式 ==========
        function changeGameMode(mode) {
            if (game.phase !== 'betting' && game.phase !== 'end') {
                showMessage('请先完成当前回合！');
                return;
            }
            
            game.mode = mode;
            
            // 更新标题
            if (mode === 'blackjack') {
                elements.gameTitle.textContent = '🎰 21点 Blackjack';
            } else {
                elements.gameTitle.textContent = '🎰 10點半 Ten & Half';
            }
            
            // 更新按钮状态
            elements.gameSelectButtons.forEach(btn => {
                if (btn.dataset.game === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 重置游戏
            newGame();
        }
        
        // ========== 显示规则 ==========
        function showRules() {
            const mode = game.mode;
            if (mode === 'blackjack') {
                elements.rulesTitle.textContent = '21点游戏规则';
            } else {
                elements.rulesTitle.textContent = '10點半游戏规则';
            }
            elements.rulesText.innerHTML = GAME_RULES[mode];
            elements.rulesModal.style.display = 'block';
        }

        // ========== 事件监听器 ==========
        function attachEventListeners() {
            // 游戏选择按钮
            elements.gameSelectButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const gameMode = this.dataset.game;
                    changeGameMode(gameMode);
                });
            });
            
            // 下注按钮
            elements.betButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const betAmount = parseInt(this.dataset.bet);
                    placeBet(betAmount);
                });
            });
            
            // 要牌
            elements.btnHit.addEventListener('click', hit);
            
            // 停牌
            elements.btnStand.addEventListener('click', stand);
            
            // 新游戏
            elements.btnNewGame.addEventListener('click', newGame);
            
            // 规则
            elements.btnRules.addEventListener('click', showRules);
            
            // 关闭弹窗
            elements.modalClose.addEventListener('click', function() {
                elements.rulesModal.style.display = 'none';
            });
            
            // 点击弹窗外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === elements.rulesModal) {
                    elements.rulesModal.style.display = 'none';
                }
            });
        }

        // ========== 页面加载完成后初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            initGame();
            attachEventListeners();
        });
    </script>
</body>
